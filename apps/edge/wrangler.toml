# Production: one Worker serves the site (apps/web at /), the 3D world (apps/client at /world/; /game/ redirects there) and the API (/v1/*, /health).
# Relational data + worlds live in one SQLite Durable Object (PlatformDO) — see apps/edge/src/worker.ts and docs/09.
# Deploy: `pnpm deploy:edge` (builds web+client into ./public, then wrangler deploy). Secret: `wrangler secret put LCW_OPERATOR_TOKEN`.
name = "lcw"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
# Company app (WWS): served on the company subdomain like the other wws-cloud workers (team rule 11-10: no workers.dev URLs).
# The account-wide workers.dev name is "beff-data", so workers.dev stays off to keep LCW out from under that name.
workers_dev = false
preview_urls = false
routes = [{ pattern = "lcw.worldwidesomething.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Everything that can be HTML runs the Worker first: /r/* and /s/* get their own share tags (src/report-page.ts,
# src/showroom-page.ts), and every page is compressed by the Worker, since the no-transform that keeps Cloudflare's
# analytics beacon out also turns off Cloudflare's compression (src/html-cache.ts). Hashed and binary files skip the
# Worker and go straight from the asset store (the same list tools/site-headers.mjs detaches; a test keeps them equal).
run_worker_first = ["/*", "!/assets/*", "!/world/assets/*", "!/adventure/assets/*", "!/game/assets/*", "!/media/*", "!/og/*", "!/og-report.png", "!/robots.txt", "!/sitemap.xml", "!/version.json", "!/family-sw.js", "!/family.webmanifest", "!/icons/*"]

[ai]
binding = "AI"

# Neural NPC voice (src/tts.ts, docs/04 4.8): Workers AI Aura lines cached in the VOICE bucket under tts/v1/, metered by
# the quota ladder. Any value but "on" sends every client back to the device voice (the client also falls back by itself
# on any refusal, failure or a line slower than 1.5 s).
[vars]
TTS_NEURAL = "on"

# Children's voice clips (src/voice.ts, docs/09 §10). Create once before the first deploy: `npx wrangler r2 bucket create lcw-voice`.
[[r2_buckets]]
binding = "VOICE"
bucket_name = "lcw-voice"

[[durable_objects.bindings]]
name = "PLATFORM"
class_name = "PlatformDO"

# Multi rooms (src/room.ts): one per room name, WebSocket Hibernation relay, nothing stored. docs/02 §11.
[[durable_objects.bindings]]
name = "WORLD_ROOM"
class_name = "WorldRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlatformDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WorldRoomDO"]

[triggers]
# docs/09 §2: daily 03:00 UTC retention, Monday 06:00 weekly reports, and every 5 minutes the abandoned-lesson sweep
# (lesson-mode.ts LESSON_IDLE_CLOSE_MS), which runs the hourly tasks ('0 * * * *': report reminders, quota, push) at
# minute 0 (platform.ts scheduled) so the account stays at three triggers.
crons = ["0 3 * * *", "*/5 * * * *", "0 6 * * 1"]
