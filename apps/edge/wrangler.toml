# Production: one Worker serves the site (apps/web at /), the game (apps/client at /game/) and the API (/v1/*, /health).
# Relational data + worlds live in one SQLite Durable Object (PlatformDO) — see apps/edge/src/worker.ts and docs/09.
# Deploy: `pnpm deploy:edge` (builds web+client into ./public, then wrangler deploy). Secret: `wrangler secret put LCW_OPERATOR_TOKEN`.
name = "lcw"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
# Company app (WWS): served on the company subdomain like the other wws-cloud workers (team rule 11-10: no workers.dev URLs).
# The account-wide workers.dev name is "beff-data", so workers.dev stays off to keep LCW out from under that name.
workers_dev = false
preview_urls = false
routes = [{ pattern = "lcw.worldwidesomething.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /r/* runs the Worker first so report share links get name-free preview tags (src/report-page.ts).
run_worker_first = ["/v1/*", "/health", "/r/*"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "PLATFORM"
class_name = "PlatformDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlatformDO"]

[triggers]
# docs/09 §2: daily 03:00 UTC retention, hourly report reminders/quota, Monday 06:00 weekly reports
crons = ["0 3 * * *", "0 * * * *", "0 6 * * 1"]
